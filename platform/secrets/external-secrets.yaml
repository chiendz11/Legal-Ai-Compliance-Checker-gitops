apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legal-database
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: legal-local-aws
    kind: ClusterSecretStore
  target:
    name: legal-database
    creationPolicy: Merge
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: legal-checker/local/database
