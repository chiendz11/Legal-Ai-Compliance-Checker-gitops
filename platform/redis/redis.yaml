apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: legal-redis}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app: legal-redis}
  template:
    metadata:
      labels: {app: legal-redis}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: public.ecr.aws/docker/library/redis:8.2.2-alpine@sha256:59b6e694653476de2c992937ebe1c64182af4728e54bb49e9b7a6c26614d8933
          command: [sh, -ec]
          args:
            - |
              umask 077
              printf 'dir /data\nappendonly yes\nrequirepass %s\n' "$(cat /credentials/password)" > /tmp/redis.conf
              exec redis-server /tmp/redis.conf
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [sh, -ec, 'REDISCLI_AUTH="$(cat /credentials/password)" redis-cli ping | grep -q PONG']
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: credentials, mountPath: /credentials, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
        - name: credentials
          secret:
            secretName: legal-redis
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 1Gi}
