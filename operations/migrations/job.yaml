apiVersion: batch/v1
kind: Job
metadata:
  name: legal-db-migrate
  labels:
    app.kubernetes.io/part-of: legal-checker
    legal-checker.io/operation: migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: registry.invalid/legal-checker/backend:NOT_BUILT
          imagePullPolicy: Never
          command: [python, -m, alembic, -c, backend/alembic.ini, upgrade, head]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: legal-database, key: DATABASE_URL}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
