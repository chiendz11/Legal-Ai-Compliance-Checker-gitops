apiVersion: kustomize.config.k8s.io/v1beta1
images:
- name: ghcr.io/chiendz11/legal-ai-compliance-checker-backend
  newTag: sha-d45b988d917261547e6bfa1b08c7a107fbebfca1
- name: ghcr.io/chiendz11/legal-ai-compliance-checker-frontend
  newTag: sha-d45b988d917261547e6bfa1b08c7a107fbebfca1
kind: Kustomization
namespace: legal-checker
resources:
- ../../../workloads/backend
- ../../../workloads/frontend
configMapGenerator:
- name: legal-backend-config
  literals:
  - SOURCE_CACHE_DIR=/cache/source
  - UPLOAD_DIR=/cache/uploads
  - REPORT_EXPORT_DIR=/cache/report_exports
  - ASSESSMENT_MODULES=modules
  - ASSESSMENT_LLM=groq
  - OPENAI_MODEL=openai/gpt-oss-20b
  - ASSESSMENT_QUEUE=inline
  - SOURCE_DOWNLOAD_TIMEOUT_SECONDS=30
  - SOURCE_MAX_BYTES=104857600
  - PYTHONDONTWRITEBYTECODE=1
