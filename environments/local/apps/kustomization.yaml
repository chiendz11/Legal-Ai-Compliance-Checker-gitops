apiVersion: kustomize.config.k8s.io/v1beta1
images:
- name: ghcr.io/chiendz11/legal-ai-compliance-checker-backend
  newTag: sha-a7350e95559a5a1cf8d059ea25a71335c0adea57
- name: ghcr.io/chiendz11/legal-ai-compliance-checker-frontend
  newTag: sha-a7350e95559a5a1cf8d059ea25a71335c0adea57
kind: Kustomization
namespace: legal-checker
resources:
- ../../../workloads/storage
- ../../../workloads/backend
- ../../../workloads/frontend
- ../../../workloads/worker
- ../../../workloads/edge
configMapGenerator:
- name: legal-backend-config
  literals:
  - SOURCE_CACHE_DIR=/cache/source
  - UPLOAD_DIR=/cache/uploads
  - REPORT_EXPORT_DIR=/cache/report_exports
  - ASSESSMENT_MODULES=modules
  - ASSESSMENT_LLM=openai
  - OPENAI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai
  - OPENAI_MODEL=gemini-3.5-flash-lite
  - SOURCE_DOWNLOAD_TIMEOUT_SECONDS=30
  - SOURCE_MAX_BYTES=104857600
  - PYTHONDONTWRITEBYTECODE=1
  - ASSESSMENT_QUEUE=celery
  - RUN_LEASE_SECONDS=600
  - RUN_REQUEUE_AFTER_SECONDS=120
  - RUN_RECOVERY_INTERVAL_SECONDS=60
replicas:
- name: legal-backend
  count: 2
- name: legal-frontend
  count: 2
generatorOptions:
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
