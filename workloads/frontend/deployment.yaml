apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: legal-frontend}
  template:
    metadata:
      labels: {app: legal-frontend}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/chiendz11/legal-ai-compliance-checker-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
          env:
            - name: BACKEND_HOST
              value: legal-backend
          startupProbe:
            httpGet: {path: /, port: http}
            failureThreshold: 30
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
