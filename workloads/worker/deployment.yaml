apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-worker
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: legal-worker
  template:
    metadata:
      labels:
        app: legal-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: ghcr.io/chiendz11/legal-ai-compliance-checker-backend:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: legal-backend-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: legal-database
              key: DATABASE_URL
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: legal-llm-secret
              key: GROQ_API_KEY
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: legal-llm-secret
              key: OPENAI_API_KEY
              optional: true
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: legal-redis
              key: REDIS_URL
        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - celery -A legal_checker.worker.celery_app:app inspect ping --destination="legal@$HOSTNAME"
              --timeout=5 | grep -q pong
          timeoutSeconds: 15
          periodSeconds: 30
          failureThreshold: 20
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - celery -A legal_checker.worker.celery_app:app inspect ping --destination="legal@$HOSTNAME"
              --timeout=5 | grep -q pong
          timeoutSeconds: 15
          periodSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        volumeMounts:
        - name: cache
          mountPath: /cache
        - name: tmp
          mountPath: /tmp
        command:
        - celery
        - -A
        - legal_checker.worker.celery_app:app
        - worker
        - --loglevel=INFO
        - --concurrency=1
        - --hostname=legal@%h
        - --pidfile=/tmp/worker.pid
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: legal-shared-files
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      terminationGracePeriodSeconds: 300
