apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-backend
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: legal-backend
  template:
    metadata:
      labels:
        app: legal-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: ghcr.io/chiendz11/legal-ai-compliance-checker-backend:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: legal-backend-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: legal-database
              key: DATABASE_URL
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: legal-llm-secret
              key: GROQ_API_KEY
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: legal-llm-secret
              key: OPENAI_API_KEY
              optional: true
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: legal-redis
              key: REDIS_URL
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 60
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/v1/knowledge
            port: http
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        volumeMounts:
        - name: cache
          mountPath: /cache
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: legal-shared-files
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
